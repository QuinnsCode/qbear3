<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Rusty Buns sweeping the whole stack under the convenience rug</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b14"/>
      <stop offset="1" stop-color="#4a2e1f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a2a"/>
      <stop offset="1" stop-color="#5a341c"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b766"/>
      <stop offset="1" stop-color="#c97a2c"/>
    </linearGradient>
    <pattern id="planks" width="220" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 39.5 H220 M110 0 V40" stroke="#4a2a14" stroke-width="2" opacity="0.5"/>
    </pattern>
    <pattern id="weave" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M13 3 L23 13 L13 23 L3 13 Z" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- room -->
  <rect width="1600" height="700" fill="url(#wall)"/>
  <rect y="300" width="1600" height="400" fill="url(#floor)"/>
  <rect y="300" width="1600" height="400" fill="url(#planks)"/>
  <rect y="292" width="1600" height="12" fill="#1f130d"/>

  <!-- a framed motto on the wall -->
  <g transform="translate(120 70)">
    <rect width="360" height="150" rx="6" fill="#f5ead8" stroke="#1f130d" stroke-width="10"/>
    <text x="180" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#2b1b14">Live, Laugh,</text>
    <text x="180" y="104" text-anchor="middle" font-size="30" font-weight="700" fill="#c2410c">Ship One Binary</text>
  </g>

  <!-- the stuff already under the rug: lumps -->
  <g filter="url(#soft)">
    <!-- rug body with lumps (drawn as one path so the lumps are the rug) -->
    <path d="M300 640
             L300 470
             C340 470 360 400 420 400 C480 400 500 470 540 470
             C580 470 600 380 690 380 C780 380 790 470 830 470
             C870 470 890 420 950 420 C1010 420 1020 470 1060 470
             L1230 470 L1230 640 Z" fill="url(#rug)"/>
    <path d="M300 640
             L300 470
             C340 470 360 400 420 400 C480 400 500 470 540 470
             C580 470 600 380 690 380 C780 380 790 470 830 470
             C870 470 890 420 950 420 C1010 420 1020 470 1060 470
             L1230 470 L1230 640 Z" fill="url(#weave)"/>
  </g>
  <!-- rug border and fringe -->
  <path d="M318 636 L318 486 M1212 486 L1212 636 M318 636 H1212" stroke="#fde68a" stroke-width="4" stroke-dasharray="14 8" fill="none" opacity="0.8"/>
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M300 648 v14 M320 648 v14 M340 648 v14 M360 648 v14 M380 648 v14 M400 648 v14 M420 648 v14 M440 648 v14 M460 648 v14 M480 648 v14 M500 648 v14 M520 648 v14 M540 648 v14 M560 648 v14 M580 648 v14 M600 648 v14 M620 648 v14 M640 648 v14 M660 648 v14 M680 648 v14 M700 648 v14 M720 648 v14 M740 648 v14 M760 648 v14 M780 648 v14 M800 648 v14 M820 648 v14 M840 648 v14 M860 648 v14 M880 648 v14 M900 648 v14 M920 648 v14 M940 648 v14 M960 648 v14 M980 648 v14 M1000 648 v14 M1020 648 v14 M1040 648 v14 M1060 648 v14 M1080 648 v14 M1100 648 v14 M1120 648 v14 M1140 648 v14 M1160 648 v14 M1180 648 v14 M1200 648 v14 M1220 648 v14"/>
  </g>
  <text x="765" y="578" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="6" fill="#fde68a">THE CONVENIENCE RUG</text>
  <text x="765" y="612" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="3" fill="#fed7aa" opacity="0.9">nothing to see here · just one binary</text>

  <!-- names poking out from under the lumps -->
  <g font-size="20" font-weight="700" text-anchor="middle">
    <g transform="translate(420 448) rotate(-8)">
      <rect x="-62" y="-22" width="124" height="34" rx="6" fill="#f3f4f6"/>
      <text y="3" fill="#1e3a8a">SQLite</text>
    </g>
    <g transform="translate(690 432) rotate(5)">
      <rect x="-82" y="-24" width="164" height="38" rx="19" fill="#f6821f"/>
      <text y="3" fill="#fff">Cloudflare</text>
    </g>
    <g transform="translate(950 452) rotate(-4)">
      <rect x="-66" y="-22" width="132" height="34" rx="6" fill="#d50c2d"/>
      <text y="3" fill="#fff">Hetzner</text>
    </g>
  </g>

  <!-- the pile still waiting to be swept, spilling off the rug's edge to the right -->
  <g font-weight="800" text-anchor="middle" filter="url(#soft)">
    <!-- AWS crate -->
    <g transform="translate(1290 560) rotate(-6)">
      <rect x="-70" y="-50" width="140" height="100" rx="8" fill="#232f3e"/>
      <text y="6" font-size="36" fill="#fff">AWS</text>
      <path d="M-40 24 Q0 42 40 24" stroke="#ff9900" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    <!-- GCP tile -->
    <g transform="translate(1400 600) rotate(8)">
      <rect x="-60" y="-34" width="120" height="68" rx="10" fill="#fff"/>
      <rect x="-60" y="-34" width="30" height="6" fill="#4285f4"/>
      <rect x="-30" y="-34" width="30" height="6" fill="#ea4335"/>
      <rect x="0" y="-34" width="30" height="6" fill="#fbbc05"/>
      <rect x="30" y="-34" width="30" height="6" fill="#34a853"/>
      <text y="16" font-size="30" fill="#3c4043">GCP</text>
    </g>
    <!-- Railway -->
    <g transform="translate(1270 450) rotate(10)">
      <rect x="-74" y="-24" width="148" height="48" rx="24" fill="#853bce"/>
      <text y="8" font-size="22" fill="#fff">Railway</text>
    </g>
    <!-- Vite bolt -->
    <g transform="translate(1440 470) rotate(-12)">
      <rect x="-56" y="-46" width="112" height="92" rx="14" fill="#1a1a2e"/>
      <path d="M-10 -34 L-24 6 L-2 6 L-12 36 L22 -10 L2 -10 L14 -34 Z" fill="#ffc517"/>
    </g>
    <text x="1440" y="540" font-size="20" fill="#e9d5ff" transform="rotate(-12 1440 540)">Vite</text>
    <!-- PGlite -->
    <g transform="translate(1180 390) rotate(-14)">
      <rect x="-60" y="-22" width="120" height="44" rx="8" fill="#336791"/>
      <text y="8" font-size="22" fill="#fff">PGlite</text>
    </g>
    <!-- Effect -->
    <g transform="translate(1385 380) rotate(14)">
      <rect x="-56" y="-22" width="112" height="44" rx="8" fill="#0b0b0b" stroke="#fff" stroke-width="2"/>
      <text y="8" font-size="22" fill="#fff">Effect</text>
    </g>
    <!-- Alchemy flask -->
    <g transform="translate(1520 380) rotate(6)">
      <path d="M-14 -46 H14 V-16 L40 34 Q44 44 32 44 H-32 Q-44 44 -40 34 L-14 -16 Z" fill="#7c3aed" stroke="#ede9fe" stroke-width="3"/>
      <circle cx="-8" cy="22" r="6" fill="#c4b5fd"/>
      <circle cx="10" cy="10" r="4" fill="#c4b5fd"/>
    </g>
    <text x="1520" y="450" font-size="20" fill="#ede9fe" transform="rotate(6 1520 450)">Alchemy</text>
    <!-- Bun (the runtime), a little round bun -->
    <g transform="translate(1530 600)">
      <ellipse rx="56" ry="38" fill="#fbf0df" stroke="#3b2a1a" stroke-width="3"/>
      <circle cx="-14" cy="-2" r="4" fill="#3b2a1a"/>
      <circle cx="14" cy="-2" r="4" fill="#3b2a1a"/>
      <path d="M-8 10 Q0 16 8 10" stroke="#3b2a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text y="64" font-size="20" fill="#fbf0df">Bun</text>
    </g>
  </g>

  <!-- dust puffs from the sweeping -->
  <g fill="#f5ead8" opacity="0.35">
    <circle cx="1210" cy="520" r="14"/><circle cx="1232" cy="500" r="9"/><circle cx="1196" cy="498" r="7"/>
    <circle cx="1250" cy="530" r="6"/>
  </g>

  <!-- Rusty Buns himself, with the broom, sweeping it all leftward -->
  <g transform="translate(1040 300)">
    <!-- broom -->
    <g transform="rotate(-28 40 40)">
      <rect x="34" y="-60" width="12" height="260" rx="6" fill="#a16207"/>
      <path d="M8 196 H72 L92 262 H-12 Z" fill="#facc15" stroke="#a16207" stroke-width="4"/>
      <path d="M10 210 L0 258 M30 210 L26 258 M50 210 L54 258 M70 210 L80 258" stroke="#a16207" stroke-width="3"/>
    </g>
    <!-- the bun -->
    <g filter="url(#soft)">
      <ellipse cx="0" cy="40" rx="78" ry="62" fill="url(#bun)" stroke="#3b1d0a" stroke-width="4"/>
      <!-- rust freckles -->
      <circle cx="-38" cy="14" r="5" fill="#9a3412" opacity="0.7"/>
      <circle cx="30" cy="4" r="4" fill="#9a3412" opacity="0.7"/>
      <circle cx="44" cy="30" r="3" fill="#9a3412" opacity="0.7"/>
      <!-- sesame seeds -->
      <ellipse cx="-14" cy="-4" rx="5" ry="3" fill="#fff7ed" transform="rotate(-20 -14 -4)"/>
      <ellipse cx="8" cy="-10" rx="5" ry="3" fill="#fff7ed" transform="rotate(15 8 -10)"/>
      <ellipse cx="-30" cy="-2" rx="5" ry="3" fill="#fff7ed" transform="rotate(30 -30 -2)"/>
      <!-- face: innocent -->
      <circle cx="-20" cy="40" r="7" fill="#1f130d"/>
      <circle cx="18" cy="40" r="7" fill="#1f130d"/>
      <circle cx="-18" cy="38" r="2" fill="#fff"/>
      <circle cx="20" cy="38" r="2" fill="#fff"/>
      <path d="M-14 66 Q0 76 14 66" stroke="#1f130d" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- legs -->
      <path d="M-30 98 L-36 140 M30 98 L36 140" stroke="#3b1d0a" stroke-width="7" stroke-linecap="round"/>
      <!-- arms to the broom -->
      <path d="M-70 52 Q-96 70 -84 98 M70 48 Q92 40 98 66" stroke="#3b1d0a" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
    <!-- speech bubble -->
    <g transform="translate(-40 -140)">
      <path d="M-170 -50 H150 Q170 -50 170 -30 V22 Q170 42 150 42 H10 L-10 70 L-14 42 H-170 Q-190 42 -190 22 V-30 Q-190 -50 -170 -50 Z" fill="#fff7ed" stroke="#1f130d" stroke-width="4"/>
      <text x="-10" y="-10" text-anchor="middle" font-size="26" font-weight="800" fill="#1f130d">What infrastructure?</text>
      <text x="-10" y="24" text-anchor="middle" font-size="20" font-weight="600" fill="#9a3412">It's just a file. Double-click it.</text>
    </g>
  </g>
</svg>
