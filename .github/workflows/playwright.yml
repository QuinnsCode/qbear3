name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Prepare dev environment (env file, Prisma client, wrangler types, local D1)
      # Done here rather than inside Playwright's webServer hook: rwsdk's
      # first-run `dev:init` (generate + migrate + seed) takes longer than the
      # webServer timeout on a cold CI runner, which is why the job timed out.
      run: |
        cp .env.example .env
        pnpm run generate
        pnpm run migrate:dev
    - name: Run Playwright tests (portal smoke)
      # Only the main-domain portal spec runs in CI. The legacy auth/org/smoke
      # specs need a seeded D1 + real signup flow and are left for local runs:
      #   pnpm exec playwright test
      run: pnpm exec playwright test tests/portal.spec.ts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
